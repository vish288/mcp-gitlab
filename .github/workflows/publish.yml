name: Publish
run-name: "Publish ${{ github.ref_name }}${{ inputs.fail_at && inputs.fail_at != 'none' && ' [fail_at]' || '' }}"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # Always on a tag ref:  gh workflow run publish.yml --ref refs/tags/vX.Y.Z
    inputs:
      dry_run:
        description: "Report the state of each target; write nothing"
        type: boolean
        default: false
      fail_at:
        description: "Test hook: fail this job on attempt 1, before it writes, when its target is not done"
        type: choice
        options: [none, pypi, release, registry]
        default: none

# One run per tag. A duplicate (late push event, reconcile) waits, then finds everything done.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ github.ref_name }}
  FAIL_AT: ${{ inputs.fail_at || 'none' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      pypi: ${{ steps.all.outputs.pypi }}
      release: ${{ steps.all.outputs.release }}
      registry: ${{ steps.all.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag ref and version must agree with pyproject.toml
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run on a tag ref: gh workflow run publish.yml --ref refs/tags/vX.Y.Z"; exit 1; }
          v=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "${TAG#v}" = "$v" ] || { echo "::error::tag $TAG does not match pyproject version $v"; exit 1; }
      - name: State of PyPI, GitHub release and registry
        id: all
        run: |
          { echo "| tag | state | action |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          scripts/ci/state.sh all "$TAG" || [ $? -eq 1 ]   # 1 = incomplete; 2 = a target is unfixable (job red), the others still run
      - name: Reconcile workflow must be enabled
        run: |
          s=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/reconcile.yml" --jq .state || echo unknown)
          [ "$s" = active ] || echo "::warning::reconcile.yml is '$s'; run: gh workflow enable reconcile.yml"

  build:
    needs: status
    if: needs.status.outputs.pypi != 'done' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"
      - run: uv build --no-create-gitignore
      - name: sdist must contain only tracked files
        run: |
          tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||' | grep -v -e '/$' -e '^PKG-INFO$' | sort > /tmp/sdist.txt
          git ls-files | sort > /tmp/tracked.txt
          extra=$(comm -23 /tmp/sdist.txt /tmp/tracked.txt)
          [ -z "$extra" ] || { echo "::error::sdist contains untracked files:"; echo "$extra"; exit 1; }
      - run: sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true        # a re-run of this job must not 409 on its own artifact
          retention-days: 30     # the re-run window is 30 days

  pypi:
    needs: [status, build]
    if: needs.status.outputs.pypi != 'done' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Gate (fail_at test hook)
        run: scripts/ci/state.sh gate pypi "${{ needs.status.outputs.pypi }}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        continue-on-error: true   # the Confirm step below is the success criterion
        with:
          skip-existing: true
          print-hash: true
      - name: Confirm on PyPI
        run: scripts/ci/state.sh pypi "$TAG" --wait 120 --require "done"

  github-release:
    needs: [status, pypi]
    if: ${{ !cancelled() && !inputs.dry_run && (needs.status.outputs.pypi == 'done' || needs.pypi.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release state
        id: check
        run: scripts/ci/state.sh release "$TAG"
      - name: Gate (fail_at test hook)
        run: scripts/ci/state.sh gate release "${{ steps.check.outputs.state }}"
      - name: Create immutable release from the PyPI files
        if: steps.check.outputs.state != 'done'
        run: scripts/ci/state.sh release-create "$TAG"
      - name: Confirm release
        run: scripts/ci/state.sh release "$TAG" --require "done"

  registry:
    needs: [status, pypi, github-release]
    if: ${{ !cancelled() && !inputs.dry_run && (needs.status.outputs.pypi == 'done' || needs.pypi.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Registry state
        id: check
        run: scripts/ci/state.sh registry "$TAG"
      - name: Gate (fail_at test hook)
        run: scripts/ci/state.sh gate registry "${{ steps.check.outputs.state }}"
      - name: Install mcp-publisher
        if: steps.check.outputs.state != 'done'
        env:
          # Bump both together: https://github.com/modelcontextprotocol/registry/releases
          # sha256 from registry_<ver>_checksums.txt (cosign-signed: *.sigstore.json)
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz -C /usr/local/bin mcp-publisher
          mcp-publisher --version
      - name: Publish to MCP Registry
        if: steps.check.outputs.state != 'done'
        run: scripts/ci/state.sh registry-publish "$TAG"
      - name: Confirm in registry
        run: scripts/ci/state.sh registry "$TAG" --wait 60 --require "done"
